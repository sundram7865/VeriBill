# Shared Ruff settings for services/ and evals/.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.isort]
known-first-party = ["extractor", "evals", "invoiceiq_mcp", "tests"]

[lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in signatures.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Depends"]
