name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: invoiceiq
          POSTGRES_PASSWORD: invoiceiq
          POSTGRES_DB: invoiceiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U invoiceiq -d invoiceiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://invoiceiq:invoiceiq@localhost:5432/invoiceiq_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invoiceiq/api exec prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @invoiceiq/web build

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: |
          pip install -r services/extractor/requirements-dev.txt -r evals/requirements.txt -r services/mcp/requirements.txt
          pip install --no-deps -e services/extractor
      - run: ruff check services evals
      - run: ruff format --check services evals
      - name: Contract schemas are current (the API's Zod contract test reads them)
        run: python -m extractor.contract_export --check
      - run: pytest services/extractor/tests services/mcp/tests evals/tests -q

  eval-gate:
    # Offline eval gate: regenerates the seeded suite and fails on regression vs evals/baseline.json.
    # Runs inside the extractor's dev image so the Tesseract version matches the one the baseline
    # was measured with (OCR output, and therefore grounding, depends on it).
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target dev -t invoiceiq-evals services/extractor
      - name: Generate suite and run the gate
        env:
          RUN_IN_IMAGE: docker run --rm -v ${{ github.workspace }}:/repo -w /repo -e PYTHONPATH=/repo/services/extractor:/repo --entrypoint python invoiceiq-evals
        run: |
          $RUN_IN_IMAGE -m evals.generate
          $RUN_IN_IMAGE -m evals.gate
