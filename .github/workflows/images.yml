name: images

# Builds the three production images and pushes them to GitHub Container Registry:
#   ghcr.io/<owner>/invoiceiq-api, -extractor, -nginx  (tags: <git sha> and latest)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            target: runtime
          - name: extractor
            context: services/extractor
            file: services/extractor/Dockerfile
            target: prod
          - name: nginx
            context: .
            file: deploy/nginx/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/invoiceiq-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/invoiceiq-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
