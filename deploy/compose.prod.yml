# Production stack for one EC2 instance. Images come from GitHub Container Registry.
# Usage (on the server, in /opt/invoiceiq with a filled-in .env): ./scripts/deploy.sh
# Only Nginx publishes ports. Postgres, Redis, the API and the extractor stay on the private
# Docker network.
name: invoiceiq

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://invoiceiq:${POSTGRES_PASSWORD:?}@postgres:5432/invoiceiq?connect_timeout=30
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  COOKIE_SECURE: 'true'
  EXTRACTOR_URL: http://extractor:8000
  EXTRACTOR_SERVICE_TOKEN: ${EXTRACTOR_SERVICE_TOKEN:?}
  STORAGE_DRIVER: cloudinary
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-invoiceiq}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  AUDIT_SAMPLE_RATE: ${AUDIT_SAMPLE_RATE:-0.1}

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: invoiceiq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoiceiq -d invoiceiq']
      interval: 10s
      retries: 10
    mem_limit: 256m
    logging: *logging

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 10
    mem_limit: 96m
    logging: *logging

  extractor:
    image: ghcr.io/${GHCR_OWNER:?}/invoiceiq-extractor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXTRACTOR_SERVICE_TOKEN: ${EXTRACTOR_SERVICE_TOKEN:?}
      LLM_MODE: live
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      EXTRACT_MODEL: ${EXTRACT_MODEL:?}
      REPAIR_MODEL: ${REPAIR_MODEL:?}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1}
      AUTO_APPROVE_THRESHOLD: ${AUTO_APPROVE_THRESHOLD:-0.9}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 512m
    logging: *logging

  migrate:
    image: ghcr.io/${GHCR_OWNER:?}/invoiceiq-api:${IMAGE_TAG:-latest}
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    image: ghcr.io/${GHCR_OWNER:?}/invoiceiq-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 256m
    logging: *logging

  worker:
    image: ghcr.io/${GHCR_OWNER:?}/invoiceiq-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      extractor: { condition: service_healthy }
    mem_limit: 256m
    logging: *logging

  nginx:
    image: ghcr.io/${GHCR_OWNER:?}/invoiceiq-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports: ['80:80', '443:443']
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      api: { condition: service_healthy }
    # Reload every 6 hours so renewed certificates are picked up without a restart.
    command:
      ['/bin/sh', '-c', "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    mem_limit: 64m
    logging: *logging

  certbot:
    image: certbot/certbot:v3.3.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  letsencrypt:
  certbot-www:
