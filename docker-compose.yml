# Local development stack: postgres, redis, extractor, migrate (one-off), api, worker, web.
# Usage: cp .env.example .env && docker compose up --build
# The extractor has no published port: it is reachable only on this private network.
name: veribill

x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://veribill:veribill@postgres:5432/veribill?connect_timeout=30
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  COOKIE_SECURE: 'false'
  EXTRACTOR_URL: http://extractor:8000
  EXTRACTOR_SERVICE_TOKEN: ${EXTRACTOR_SERVICE_TOKEN:?set EXTRACTOR_SERVICE_TOKEN in .env}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /repo/apps/api/.data/uploads
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-veribill-dev}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  AUDIT_SAMPLE_RATE: ${AUDIT_SAMPLE_RATE:-0.1}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: runtime

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: veribill
      POSTGRES_PASSWORD: veribill
      POSTGRES_DB: veribill
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/dev-init.sql:/docker-entrypoint-initdb.d/01-dev-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veribill -d veribill']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  extractor:
    build:
      context: services/extractor
      target: prod
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXTRACTOR_SERVICE_TOKEN: ${EXTRACTOR_SERVICE_TOKEN:?set EXTRACTOR_SERVICE_TOKEN in .env}
      LLM_MODE: ${LLM_MODE:-live}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BILLING_TIER: ${LLM_BILLING_TIER:-free}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-}
      REPAIR_MODEL: ${REPAIR_MODEL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-2}
      AUTO_APPROVE_THRESHOLD: ${AUTO_APPROVE_THRESHOLD:-0.9}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    build: *api-build
    image: veribill-api:dev
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: *api-build
    image: veribill-api:dev
    environment: *api-env
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    volumes:
      - uploads:/repo/apps/api/.data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: *api-build
    image: veribill-api:dev
    command: ['node', 'dist/worker.js']
    environment: *api-env
    volumes:
      - uploads:/repo/apps/api/.data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      extractor:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://api:4000
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  # Offline eval runner with Tesseract available: docker compose run --rm evals --suite synthetic
  evals:
    profiles: ['eval']
    build:
      context: services/extractor
      target: dev
    working_dir: /repo
    environment:
      PYTHONPATH: /repo/services/extractor:/repo
      LLM_MODE: ${LLM_MODE:-replay}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BILLING_TIER: ${LLM_BILLING_TIER:-free}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-}
      REPAIR_MODEL: ${REPAIR_MODEL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-2}
      LLM_CACHE_DIR: /repo/evals/llm_cache
    volumes:
      - .:/repo
    entrypoint: ['python', '-m', 'evals.run']

volumes:
  pgdata:
  redisdata:
  uploads:
